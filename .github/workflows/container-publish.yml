name: Restore Stable Container Channel

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  restore:
    name: Verify tag isolation and restore stable digest
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify metadata action does not invent latest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/virtuarchitect/ztf-orchestrator
          flavor: latest=false
          tags: type=ref,event=tag
      - name: Require isolated tag metadata
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test -n "$TAGS"
          if [[ "$TAGS" == *":latest"* ]]; then
            echo "Unexpected automatic latest tag" >&2
            exit 1
          fi
      - name: Restore previously captured stable manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/virtuarchitect/ztf-orchestrator:latest \
            ghcr.io/virtuarchitect/ztf-orchestrator@sha256:31e7be3cd57ab2102630768da8ae0dceb504d400ae1ff5bf4afeaa666973e525
          actual="$(docker buildx imagetools inspect ghcr.io/virtuarchitect/ztf-orchestrator:latest --format '{{.Manifest.Digest}}')"
          test "$actual" = sha256:31e7be3cd57ab2102630768da8ae0dceb504d400ae1ff5bf4afeaa666973e525
