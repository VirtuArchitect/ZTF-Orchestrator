name: Publish Static Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        env:
          VITE_ZTF_DEMO: 'true'
        run: npm run build:demo -- --outDir dist-demo/demo

      - name: Add SPA fallback
        run: cp dist-demo/demo/index.html dist-demo/404.html

      - name: Assemble the site root and legacy project URL
        run: |
          mkdir -p dist-demo/project
          mv dist-demo/demo/releases dist-demo/demo/tutorials dist-demo/
          cp public/favicon.png public/favicon.svg public/zto-logo-mark.svg dist-demo/
          cp -R docs/pages/project/. dist-demo/
          cp docs/pages/project-redirect.html dist-demo/project/index.html
          cp docs/assets/readme-hero/interactive-demo-overview-light.png dist-demo/demo-overview-light.png
          cp dist-demo/social-preview.png dist-demo/demo-overview-light.png dist-demo/project/

      - name: Add illustrated user-guide videos
        run: |
          mkdir -p dist-demo/tutorials/media
          cp docs/assets/user-guide-videos/* dist-demo/tutorials/media/
          (cd dist-demo/tutorials/media && sha256sum -c SHA256SUMS)

      - name: Record published source identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs = require("fs"); const version = require("./package.json").version; fs.writeFileSync("dist-demo/demo-build.json", JSON.stringify({version, sourceRevision: process.env.SOURCE_SHA, simulated: true}) + "\n")'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo

  deploy:
    name: Deploy static demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
